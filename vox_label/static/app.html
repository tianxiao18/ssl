<!doctype html>
<meta charset="utf-8">
<title>vox label</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d27; --line:#2c2f3d; --ink:#e8e9ef; --dim:#9297ab;
    --real:#22d3ee; --fake:#fb923c; --flag:#f472b6; --cs:#7c8199;
    --hdr:42px; --ftr:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
       font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

  header{height:var(--hdr);display:flex;align-items:center;gap:16px;padding:0 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
  .sp{flex:1}
  .counter{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
  .counter b{color:var(--ink);font-weight:600}
  .blind{font-size:10.5px;color:var(--dim);border:1px solid var(--line);
         border-radius:999px;padding:1px 8px}

  /* Fixed-height grid: spectrograms left, estimates right. Nothing scrolls. */
  .wrap{height:calc(100vh - var(--hdr) - var(--ftr));display:grid;
        grid-template-columns:1fr 430px;gap:10px;padding:8px 12px}
  .left{display:flex;flex-direction:column;min-height:0;gap:6px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;
        font-variant-numeric:tabular-nums;flex:0 0 auto}
  .stack{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .frame{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);
         border-radius:5px;overflow:hidden;background:#000}
  /* fill, not contain: the panel height is the constraint, and a stretched
     spectrogram is the repo's existing convention (preserveAspectRatio="none"). */
  .frame img{display:block;width:100%;height:100%;object-fit:fill}
  .frame .chip{position:absolute;top:5px;left:7px;font-size:10.5px;color:var(--dim);
               background:rgba(0,0,0,.62);padding:1px 6px;border-radius:4px}
  .frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .frame{cursor:pointer}
  .frame.playing{border-color:var(--real)}
  #auto.on{border-color:var(--real);color:var(--real)}
  .ctl{display:inline-flex;gap:4px}
  .ic{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;
      padding:0 7px;font-size:11.5px;color:var(--dim);border:1px solid var(--line);
      border-radius:5px;background:#232633;text-decoration:none;font-variant-numeric:tabular-nums}
  .ic:hover{color:var(--ink)}
  .ic svg{width:13px;height:13px}

  .right{background:var(--panel);border:1px solid var(--line);border-radius:6px;
         display:flex;flex-direction:column;min-height:0}
  .right h2{margin:0;padding:8px 11px 6px;font-size:11px;color:var(--dim);
            text-transform:uppercase;letter-spacing:.05em;font-weight:600;
            border-bottom:1px solid var(--line)}
  .scroll{overflow:auto;flex:1 1 auto;min-height:0}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;
        font-size:11.5px}
  th,td{padding:3px 7px;border-bottom:1px solid #23263200;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;
     font-size:10px;text-transform:uppercase;letter-spacing:.04em;
     border-bottom:1px solid var(--line)}
  tr.grp td{padding-top:7px;color:var(--ink);font-weight:600;font-size:11px}
  td.na{color:var(--dim)}
  .bar{position:relative;height:7px;background:#282b39;border-radius:4px;width:112px}
  .bar i{position:absolute;top:0;bottom:0;background:var(--cs);border-radius:4px}
  .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--real)}
  .bar i.gridbar{background:var(--real);opacity:.55}

  footer{height:var(--ftr);display:flex;gap:8px;align-items:center;padding:0 16px;
         background:var(--panel);border-top:1px solid var(--line)}
  button{font:inherit;border:1px solid var(--line);background:#232633;color:var(--ink);
         border-radius:5px;padding:6px 13px;cursor:pointer}
  button:hover{border-color:#404560}
  button kbd{font:inherit;color:var(--dim);margin-right:6px}
  /* real / not-a-call are pressed on every candidate; combined and undo are rare.
     Equal weight for all four made the two that matter hard to find. */
  button.primary{font-size:15.5px;font-weight:600;padding:13px 28px;border-width:2px}
  button.primary kbd{font-size:13px;margin-right:9px}
  #real{border-color:var(--real)} #fake{border-color:var(--fake)}
  #flag.on{border-color:var(--flag);color:var(--flag)}

  #overlay{position:fixed;inset:0;background:rgba(8,9,13,.95);z-index:20;
           overflow:auto;padding:34px 20px;display:none}
  #overlay.show{display:block}
  .card{max-width:1020px;margin:0 auto;background:var(--panel);
        border:1px solid var(--line);border-radius:9px;padding:20px 24px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card p.sub{margin:0 0 16px;color:var(--dim);font-size:12.5px;line-height:1.5}
  .card table{font-size:12.5px;table-layout:fixed}
  .card th,.card td{border-bottom:1px solid var(--line);padding:4px 8px}
  /* One row per rule, one column per target: the comparison worth making is across
     rules at a fixed target, and that is what a reader scans down a column. */
  .card th.t,.card td.cell,.card td.wait{text-align:left;width:26%}
  .card td.rule{font-weight:600;white-space:nowrap}
  .card td.cell{white-space:nowrap;font-variant-numeric:tabular-nums}
  .card td.cell b{font-size:13px}
  .card .ci{color:var(--dim);font-size:11px;margin-left:3px}
  /* Each cell reads at its own checkpoint and its own stream length, so the
     checkpoint belongs in the cell rather than in a column shared across targets. */
  .card td.wait{color:var(--dim);font-variant-numeric:tabular-nums}
  .fig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
  .fig h3{margin:0 0 6px;font-size:10px;font-weight:600;color:var(--dim);
          text-transform:uppercase;letter-spacing:.04em}
  .fig .row{display:grid;grid-template-columns:62px 1fr;gap:7px;align-items:center;
            height:17px}
  .fig .row>span{font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;
                 overflow:hidden;text-overflow:ellipsis}
  .fig .track{position:relative;height:10px;background:#22252f;border-radius:2px}
  .fig .track i{position:absolute;top:2px;bottom:2px;background:var(--real);opacity:.45;
                border-radius:2px}
  .fig .track u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--real)}
  .fig .axis{display:grid;grid-template-columns:62px 1fr;gap:7px;margin-top:4px}
  .fig .axis div{display:flex;justify-content:space-between;font-size:9.5px;
                 color:var(--dim);font-weight:400}
  .rk{font-size:11.5px;padding:4px 11px 8px;border-bottom:1px solid var(--line)}
  .rk .hd{color:var(--dim);font-size:10.5px;margin:6px 0 3px}
  .rk .pr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:1px 0;
          font-variant-numeric:tabular-nums}
  .rk .pr .g{color:var(--dim);font-size:10.5px}
  .rk .rel{font-weight:600;color:var(--real);padding:0 4px}
  .rk .open .rel{color:var(--dim)}
  /* Rank column: tiers as a number, repeated for ties. */
  .rk td.rank{color:var(--dim);text-align:right;padding-right:2px;width:1.5em}
  .rk tr.lbl td{padding:6px 7px 1px;color:var(--dim);font-size:10px}
  .rk tr.pick{cursor:pointer}
  .rk tr.pick:hover td{background:#20232e}
  .rk tr.pick.on td{background:#262a38}
  .rk tr.pick.on td:nth-child(2){color:var(--real);font-weight:600}
  .rk .tog{float:right;cursor:pointer;color:var(--real);user-select:none}
  #rkcurve{position:relative;margin-top:6px}
  #rkcurve svg{display:block;width:100%;height:auto;cursor:crosshair}
  #rkcurve text{fill:var(--dim);font-size:9px}
  #rkcurve .tip{position:absolute;top:0;pointer-events:none;background:#0f1016;
                border:1px solid var(--line);border-radius:4px;padding:4px 7px;
                font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:2}
  /* The slider is placed by JS so its thumb travels exactly the chart's omega axis;
     a fixed 12px thumb makes that offset known. */
  #rkcurve .sl{position:relative;height:16px;margin-bottom:2px}
  #omega{position:absolute;top:0;height:16px;margin:0;background:transparent;
         -webkit-appearance:none;appearance:none}
  #omega::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
  #omega::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;
                               border:0;border-radius:50%;background:var(--real)}
  #omega::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
  #omega::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--real)}
  #rkcurve text.ax{fill:var(--ink);font-size:9.5px}
  /* Outdated numbers stay in place but dimmed, with a spinner and count where they are. */
  .pbar{display:inline-block;position:relative;width:90px;height:5px;border-radius:3px;
        background:var(--line);overflow:hidden;vertical-align:1px;margin-right:6px}
  .pbar i{position:absolute;top:0;bottom:0;left:0;background:var(--real);border-radius:3px;
          transition:width .3s}
  /* Queued or not yet reporting: a sliding segment, since there is no fraction yet. */
  .pbar.wait i{width:30%;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{from{left:-30%}to{left:100%}}
  .upd{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums;margin-left:6px}
  #ranking.old table,#ranking.old .pr{opacity:.35;transition:opacity .2s}
  #rkcurve.old .plot{opacity:.35;transition:opacity .2s}
  #rkcurve .busy{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;
                 font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .rk .xp{color:var(--fake);font-size:10px;margin-left:4px}
  #ranking.explore .rel,#ranking.explore td.rank{color:var(--dim)}
  .rk td.rank + td{text-align:left}
  .rk i.sw{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;
           vertical-align:middle}
  .err{color:var(--fake);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11.5px}
</style>

<header>
  <h1>vox label</h1>
  <span class="blind">blind: detector pattern hidden</span>
  <span class="sp"></span>
  <span class="counter"><b id="ndone">0</b> labeled</span>
  <span class="counter">next checkpoint in <b id="tonext">?</b></span>
  <span class="ctl">
    <button id="play" class="ic" title="play (p)"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg></button>
    <button id="auto" class="ic" title="autoplay (shift+p)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.5v3.2H8.8"/></svg></button>
    <button id="speed" class="ic" title="speed ([ / ])">1×</button>
  </span>
  <button id="ckpt" class="ic" title="checkpoint (r)"><svg viewBox="0 0 16 16"><path d="M2 14V9h3v5zm4.5 0V4h3v10zM11 14V6.5h3V14z" fill="currentColor"/></svg></button>
  <a href="/setup" class="ic" title="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
</header>

<div class="wrap">
  <div class="left">
    <div class="meta" id="meta"></div>
    <div class="stack" id="frames"></div>
  </div>
  <div class="right">
    <h2>anytime-valid performance estimates</h2>
    <div class="scroll"><div class="rk"><div id="rkcurve"><div class="plot"></div><div class="tip" hidden></div><div class="busy" hidden></div>
      <div class="sl"><input type="range" id="omega" min="0" max="20" step="1"></div></div>
      <div id="ranking"></div></div><table id="live"><thead><tr>
      <th>rule</th><th>n</th><th>est</th><th>interval</th><th></th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</div>

<footer>
  <button id="real" class="primary"><kbd>1</kbd>real call</button>
  <button id="fake" class="primary"><kbd>0</kbd>not a call</button>
  <button id="flag"><kbd>c</kbd>combined</button>
  <button id="undo"><kbd>&larr;</kbd>undo</button>
</footer>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
const $ = s => document.querySelector(s);
// 409 means no campaign is bound yet: the setup page is where one gets chosen.
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 409) { location.href = '/setup'; throw new Error('no campaign bound'); }
  return r;
}
const pct = v => v == null ? 'n/a' : (100 * v).toFixed(1) + '%';
const LABEL = {precision: 'precision', recall: 'rel. recall', f1: 'F1'};
let cur = null, combined = false, shownAt = 0, busy = false, pollTimer = null;

async function load() { render(await (await api('/api/next')).json()); }

function render(d) {
  stopAudio();
  cur = d; combined = false; shownAt = performance.now();
  $('#flag').classList.remove('on');
  $('#ndone').textContent = d.n_labeled ?? 0;
  $('#tonext').textContent = d.to_next_reveal ?? '?';
  refreshLive();
  refreshCurve();
  refreshRanking();

  if (d.done) {
    $('#meta').textContent = '';
    $('#frames').innerHTML = '<p style="color:var(--dim)">Every candidate is labeled.</p>';
    return;
  }

  $('#meta').innerHTML =
    `<span>${d.clip}</span><span>${d.t_start.toFixed(3)}–${d.t_end.toFixed(3)} s</span>` +
    `<span>${d.duration_ms.toFixed(0)} ms</span><span>#${d.cand_id}</span>`;

  // Candidate span as a fraction of the rendered view, so the bracket lands correctly
  // whatever the panel's pixel width happens to be.
  const span = d.view_hi - d.view_lo;
  const x0 = 1000 * (d.t_start - d.view_lo) / span;
  const x1 = 1000 * (d.t_end - d.view_lo) / span;

  $('#frames').innerHTML = d.channels.map(ch => `
    <div class="frame" data-ch="${ch}">
      <img src="/api/crop?cand_id=${d.cand_id}&ch=${ch}" alt="">
      <span class="chip">ch ${ch}</span>
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
        <rect x="${x0}" y="0" width="${Math.max(x1 - x0, 0.6)}" height="100"
              fill="none" stroke="var(--real)" stroke-width="2"
              stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>
        <line class="ph" x1="0" x2="0" y1="0" y2="100" stroke="var(--ink)" stroke-width="1.5"
              vector-effect="non-scaling-stroke" visibility="hidden"/>
      </svg>
    </div>`).join('');

  if (d.reveal_due) openReport();
  else if (autoplay) play(d.channels[0]);
}

// ── playback: the crop's window, band-passed, at a chosen fraction of real time ──

const SPEEDS = [1, 1 / 2, 1 / 4, 1 / 8];
const SPEED_TXT = ['1×', '½×', '¼×', '⅛×'];
const player = new Audio();
let autoplay = false, playing = null, playToken = 0, speedIdx = 1;
try {
  autoplay = localStorage.getItem('vox-autoplay') === '1';
  const i = SPEEDS.indexOf(+localStorage.getItem('vox-speed'));
  if (i >= 0) speedIdx = i;
} catch (e) {}
$('#auto').classList.toggle('on', autoplay);
$('#speed').textContent = SPEED_TXT[speedIdx];

// Takes effect from the next play; the current one keeps its speed.
function setSpeed(i) {
  speedIdx = Math.min(SPEEDS.length - 1, Math.max(0, i));
  $('#speed').textContent = SPEED_TXT[speedIdx];
  try { localStorage.setItem('vox-speed', SPEEDS[speedIdx]); } catch (e) {}
}

function setAutoplay(on) {
  autoplay = on;
  $('#auto').classList.toggle('on', on);
  try { localStorage.setItem('vox-autoplay', on ? '1' : '0'); } catch (e) {}
  if (on && cur && !cur.done && !playing) play(cur.channels[0]);
  if (!on) stopAudio();
}

function stopAudio() {
  playToken++;
  player.pause();
  if (player.src) { URL.revokeObjectURL(player.src); player.removeAttribute('src'); }
  playing = null;
  document.querySelectorAll('.frame.playing').forEach(f => f.classList.remove('playing'));
  document.querySelectorAll('.frame .ph').forEach(l => l.setAttribute('visibility', 'hidden'));
}

// Defaults to the first channel shown, never the one a detector fired on (blind).
async function play(ch) {
  if (!cur || cur.done) return;
  stopAudio();
  const token = playToken, c = cur;
  const r = await api(`/api/audio?cand_id=${c.cand_id}&ch=${ch}&slow=${1 / SPEEDS[speedIdx]}`);
  if (token !== playToken) return;              // labeled or replaced meanwhile
  if (!r.ok) return console.warn('audio', r.status, await r.text());
  const lo = +r.headers.get('X-Span-Lo'), hi = +r.headers.get('X-Span-Hi');
  player.src = URL.createObjectURL(await r.blob());
  if (token !== playToken) return;
  const frame = document.querySelector(`.frame[data-ch="${ch}"]`);
  playing = {frame, lo, hi, c};
  frame?.classList.add('playing');
  player.play().catch(e => { stopAudio(); console.warn('audio', e); });
  requestAnimationFrame(tick);
}

// Playhead: audio time back to the view's [view_lo, view_hi], like the bracket.
function tick() {
  if (!playing || !playing.frame) return;
  const {frame, lo, hi, c} = playing, line = frame.querySelector('.ph');
  if (player.ended) { stopAudio(); return; }
  if (player.duration) {
    const t = lo + (hi - lo) * player.currentTime / player.duration;
    const x = 1000 * (t - c.view_lo) / (c.view_hi - c.view_lo);
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('visibility', 'visible');
  }
  requestAnimationFrame(tick);
}

$('#frames').addEventListener('click', e => {
  const f = e.target.closest('.frame[data-ch]');
  if (f) play(+f.dataset.ch);
});
$('#play').addEventListener('click', () => cur && !cur.done && play(cur.channels[0]));
$('#auto').addEventListener('click', () => setAutoplay(!autoplay));
$('#speed').addEventListener('click', () => setSpeed((speedIdx + 1) % SPEEDS.length));

async function refreshLive() {
  const d = await (await api('/api/live')).json();
  const tb = $('#live tbody');
  let html = '', lastRule = null;
  for (const r of d.rows) {
    if (r.rule !== lastRule) {
      html += `<tr class="grp"><td colspan="5">${r.rule}</td></tr>`;
      lastRule = r.rule;
    }
    if (!r.n) {
      html += `<tr><td style="padding-left:14px">${LABEL[r.target]}</td>` +
              `<td class="na" colspan="4">no observations yet</td></tr>`;
      continue;
    }
    const w = 100 * (r.hi - r.lo), l = 100 * r.lo, e = 100 * r.estimate;
    html += `<tr><td style="padding-left:14px">${LABEL[r.target]}</td>
      <td>${r.n}</td><td>${pct(r.estimate)}</td>
      <td>${pct(r.lo)}–${pct(r.hi)}</td>
      <td><div class="bar"><i style="left:${l}%;width:${w}%"></i>
          <u style="left:${e}%"></u></div></td></tr>`;
  }
  tb.innerHTML = html;
}

// ── the partial order (main.pdf), recomputed in the background ───────────────

const REL = {succ_delta: '\u227b\u03b4', approx: '\u2248\u03b4', succ: '\u227b',
             unresolved: '\u22c8'};
const pts = v => v == null ? '?' : (100 * v).toFixed(1);
let rankTimer = null, curveTimer = null, slideTimer = null;

// Series colors in campaign rule order, so a rule keeps its color whatever its rank.
// Dark-mode reference palette, validated against the panel surface #1b1d27.
const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300',
                '#9085e9', '#e66767'];
let ruleOrder = [], viewOmega = null, frozenOmega = null, lastCurve = null, lastFocus = null;
const rankCache = {};    // omega -> {r, at}
const jobs = {rank: null, curve: null};   // running job state, for the progress bars
const colorOf = rule => SERIES[Math.max(0, ruleOrder.indexOf(rule)) % SERIES.length];
const nLabeled = () => (cur && cur.n_labeled) || 0;

// Same grid as ranking.omega_grid: steps of 0.05 plus the frozen omega.
function omegaGrid() {
  const g = new Set(Array.from({length: 21}, (_, i) => +(i * 0.05).toFixed(4)));
  if (frozenOmega != null) g.add(frozenOmega);
  return [...g].sort((a, b) => a - b);
}

async function refreshRanking() {
  clearTimeout(rankTimer);
  const q = viewOmega == null ? '' : `&omega=${viewOmega}`;
  const d = await (await api('/api/ranking?start=1' + q)).json();
  if (d.status === 'error') { $('#ranking').innerHTML = `<div class="err">${d.error}</div>`; return; }
  frozenOmega = d.frozen_omega;
  if (viewOmega == null) viewOmega = d.omega;
  syncSlider();
  if (d.omega !== viewOmega) return;           // the slider has moved on
  const busy = d.status === 'computing' || d.status === 'queued';
  jobs.rank = busy ? d : null;
  drawProgress();
  if (d.result) rankCache[d.omega] = {r: d.result, at: d.at};
  showRanking(busy);
  if (busy) rankTimer = setTimeout(refreshRanking, 1000);
}

function showRanking(busy) {
  const c = rankCache[viewOmega];
  if (c) drawRanking(c.r, busy || c.at !== nLabeled(), viewOmega !== frozenOmega);
  else if (lastRank) drawRanking(lastRank.r, true, lastRank.explore);
}

async function refreshCurve() {
  clearTimeout(curveTimer);
  const d = await (await api('/api/curve?start=1')).json();
  if (d.result) { lastCurve = d.result; ruleOrder = Object.keys(d.result.rules); drawCurve(); }
  const busy = d.status === 'computing' || d.status === 'queued';
  jobs.curve = busy ? d : null;
  drawProgress();
  if (busy) curveTimer = setTimeout(refreshCurve, 1500);
}

function jobText(j) {
  const [done, total] = j.progress || [0, null];
  if (j.status === 'queued' || !total)
    return `<span class="pbar wait"><i></i></span>${j.status === 'queued' ? 'queued' : 'starting'}`;
  const pct = Math.round(100 * done / total);
  return `<span class="pbar"><i style="width:${pct}%"></i></span>${pct}%`;
}

// Spinner and progress in place of whatever a running job will replace.
function drawProgress() {
  const c = jobs.curve, busy = $('#rkcurve .busy');
  $('#rkcurve').classList.toggle('old', !!c);
  busy.hidden = !c;
  if (c) busy.innerHTML = `updating curve ${jobText(c)}`;
  const u = $('#ranking .upd');
  if (u) u.innerHTML = jobs.rank ? jobText(jobs.rank) : '';
}

function syncSlider() {
  const g = omegaGrid(), el = $('#omega');
  el.max = g.length - 1;
  if (viewOmega != null) el.value = g.indexOf(viewOmega);
}

// Chart geometry (SVG units). The slider spans [L, W - R] so it lines up with the axis.
const CV = {W: 400, H: 154, L: 40, R: 8, T: 14, B: 30};
(() => {
  const el = $('#omega');
  el.style.left = `calc(${100 * CV.L / CV.W}% - 6px)`;
  el.style.width = `calc(${100 * (CV.W - CV.L - CV.R) / CV.W}% + 12px)`;
})();

function setOmega(w) {
  if (w === viewOmega) return;
  viewOmega = w;
  syncSlider();
  drawCurve();
  showRanking(true);
  if (!rankCache[w] || rankCache[w].at !== nLabeled()) {
    jobs.rank = {status: 'queued'};
    drawProgress();
  }
  clearTimeout(slideTimer);
  slideTimer = setTimeout(refreshRanking, 250);
}

$('#omega').addEventListener('input', e => setOmega(omegaGrid()[+e.target.value]));
// Give the labeling keys back once the slider is let go.
$('#omega').addEventListener('change', e => e.target.blur());

function drawCurve() {
  const c = lastCurve;
  if (!c) return;
  const {W, H, L, R, T, B} = CV;
  const om = c.omegas, names = Object.keys(c.rules);
  const f = lastFocus && c.rules[lastFocus] ? lastFocus : null;
  const vals = names.flatMap(r => c.rules[r].estimate)
    .concat(f ? c.rules[f].lo.concat(c.rules[f].hi) : []).filter(v => v != null);
  if (!vals.length) return;
  const y0 = Math.max(0, Math.floor((Math.min(...vals) - 0.02) * 10) / 10);
  const y1 = Math.min(1, Math.ceil((Math.max(...vals) + 0.02) * 10) / 10);
  const X = w => L + (W - L - R) * w, Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const pts2 = (arr, ws = om) => arr.map((v, i) => v == null ? null
    : `${X(ws[i]).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);
  const line = (r, w, op) => `<polyline points="${pts2(c.rules[r].estimate).join(' ')}" fill="none" ` +
    `stroke="${colorOf(r)}" stroke-width="${w}" stroke-linejoin="round" opacity="${op}"/>`;
  const ticks = [y0, (y0 + y1) / 2, y1];
  let svg = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>` +
    `<text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end">${Math.round(100 * v)}</text>`).join('');
  // Two tick rows: omega itself, then what it means at the landmarks. A name is
  // shifted inward just enough to stay inside the chart.
  const fit = (x, txt) => Math.min(Math.max(x, txt.length * 2.6), W - txt.length * 2.6);
  svg += [0, 0.5, 1].map(w => `<text x="${X(w)}" y="${H - B + 11}" text-anchor="middle">${w}</text>`).join('');
  svg += [[0, 'recall'], [0.5, 'F1'], [1, 'precision']].map(([w, t]) =>
    `<text x="${fit(X(w), t)}" y="${H - B + 22}" text-anchor="middle" opacity=".75">${t}</text>`).join('');
  svg += `<text class="ax" transform="translate(9 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">` +
         `S<tspan baseline-shift="sub" font-size="7">\u03c9</tspan> (%)</text>`;
  if (f) {
    const up = pts2(c.rules[f].hi), dn = pts2(c.rules[f].lo).reverse();
    svg += `<polygon points="${up.concat(dn).join(' ')}" fill="${colorOf(f)}" opacity=".3"/>`;
    for (const edge of [up, dn])
      svg += `<polyline points="${edge.join(' ')}" fill="none" stroke="${colorOf(f)}" ` +
             `stroke-width=".8" stroke-dasharray="2 2" opacity=".8"/>`;
  }
  svg += names.filter(r => r !== f).map(r => line(r, 1.5, f ? 0.45 : 0.9)).join('');
  if (f) svg += line(f, 2.5, 1);
  if (frozenOmega != null)
    svg += `<line x1="${X(frozenOmega)}" x2="${X(frozenOmega)}" y1="${T}" y2="${H - B}" ` +
           `stroke="var(--dim)" stroke-dasharray="3 3"/>`;
  if (viewOmega != null)
    svg += `<line x1="${X(viewOmega)}" x2="${X(viewOmega)}" y1="${T}" y2="${H - B}" ` +
           `stroke="var(--ink)" stroke-width="1.5" opacity=".8"/>` +
           `<text class="ax" x="${X(viewOmega)}" y="${T - 4}" text-anchor="${
             viewOmega < 0.12 ? 'start' : viewOmega > 0.88 ? 'end' : 'middle'}">` +
           `\u03c9 = ${viewOmega.toFixed(2)}</text>`;
  svg += `<rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>`;
  $('#rkcurve .plot').innerHTML = `<svg viewBox="0 0 ${W} ${H}">${svg}</svg>`;
  const el = $('#rkcurve svg'), tip = $('#rkcurve .tip');
  const nearest = e => {
    const b = el.getBoundingClientRect();
    const w = ((e.clientX - b.left) / b.width * W - L) / (W - L - R);
    return om.reduce((a, x) => Math.abs(x - w) < Math.abs(a - w) ? x : a, om[0]);
  };
  el.onmousemove = e => {
    const w = nearest(e), i = om.indexOf(w);
    const rows = names.map(r => [r, c.rules[r].estimate[i]]).filter(x => x[1] != null)
      .sort((a, b) => b[1] - a[1]);
    tip.innerHTML = `<div style="color:var(--dim)">\u03c9 = ${w.toFixed(2)}</div>` + rows.map(([r, v]) =>
      `<div><i class="sw" style="background:${colorOf(r)}"></i>${r} ${pct(v)}</div>`).join('');
    tip.hidden = false;
    const b = el.getBoundingClientRect(), x = e.clientX - b.left;
    tip.style.left = (x > b.width / 2 ? x - tip.offsetWidth - 10 : x + 10) + 'px';
  };
  el.onmouseleave = () => { tip.hidden = true; };
  el.onclick = e => setOmega(nearest(e));
}

// Tiers from settled "better" verdicts (and chains of them). A boundary between tiers
// is kept only if everything above it beats everything below it, so a tier gap never
// claims an unsettled pair. A cycle means some verdict is wrong: it and everything
// below it are 'conflict'.
function tiers(r) {
  const names = r.rules.map(x => x.rule);
  const above = {};
  for (const x of names) above[x] = new Set();
  for (const p of r.pairs) {
    if (p.relation !== 'succ' && p.relation !== 'succ_delta') continue;
    const [w, l] = p.winner === 'k' ? [p.b, p.a] : [p.a, p.b];
    above[l].add(w);
  }
  // Transitive closure: above[x] = every rule shown, directly or by a chain, to beat x.
  for (let grew = true; grew;) {
    grew = false;
    for (const x of names)
      for (const w of [...above[x]])
        for (const v of above[w]) if (!above[x].has(v)) { above[x].add(v); grew = true; }
  }
  // A rule with no settled "better" verdict either way would sit on top and block
  // every boundary, so it is set aside. If that is every rule, there is one group.
  const loose = names.filter(x => !above[x].size && !names.some(y => above[y].has(x)));
  const tier = {};
  if (loose.length === names.length) { for (const x of names) tier[x] = 1; return tier; }
  for (const x of loose) tier[x] = 'unranked';
  // Layers: peel off the rules nothing remaining beats.
  const layers = [];
  let left = names.filter(x => !loose.includes(x));
  while (left.length) {
    const top = left.filter(x => ![...above[x]].some(w => left.includes(w)));
    if (!top.length) break;
    layers.push(top);
    left = left.filter(x => !top.includes(x));
  }
  // Keep a boundary only if it is fully backed; otherwise merge across it.
  for (const x of left) tier[x] = 'conflict';
  let k = 1;
  layers.forEach((layer, i) => {
    if (i > 0) {
      const hi = layers.slice(0, i).flat(), lo = layers.slice(i).flat();
      if (lo.every(y => hi.every(x => above[y].has(x)))) k++;
    }
    for (const x of layer) tier[x] = k;
  });
  return tier;
}

// Pairwise panel: one detector against the rest. Defaults to the best-ranked one;
// clicking a rule in the list focuses it. The full list sits behind a toggle.
const REL_LOSE = {succ_delta: '≺δ', succ: '≺'};
let focusRule = null, showAll = false, lastRank = null;

function pairNote(p, flip) {
  const [glo, ghi] = flip ? [-p.gap_hi, -p.gap_lo] : [p.gap_lo, p.gap_hi];
  let note = `gap ${pts(glo)} to ${pts(ghi)}`;
  const f = p.forecast;
  if (f) note += f.reliable ? `, ~${Math.round(f.remaining).toLocaleString()} more`
                            : `, forecast after n>${Math.round(8 * f.n0_y)}`;
  return note;
}

function pairRow(left, sym, right, p, flip) {
  const done = p.relation === 'succ_delta' || p.relation === 'approx';
  return `<div class="pr${done ? '' : ' open'}"><span>${left}<span class="rel">${sym}</span>${right}</span>` +
         `<span class="g">${pairNote(p, flip)}</span></div>`;
}

// Winner on the left, as the pair was decided.
function anyPair(p) {
  const flip = p.winner === 'k';
  return pairRow(flip ? p.b : p.a, REL[p.relation], flip ? p.a : p.b, p, flip);
}

// Focused rule always on the left; the symbol turns round when it is the loser.
function focusPair(p, f) {
  const flip = p.b === f;
  const other = flip ? p.a : p.b;
  const lost = p.winner != null && (p.winner === 'k') !== flip;
  const sym = lost ? REL_LOSE[p.relation] : REL[p.relation];
  return pairRow(f, sym, other, p, flip);
}

function drawRanking(r, stale, explore = false) {
  lastRank = {r, stale, explore};
  $('#ranking').classList.toggle('old', stale);
  if (!ruleOrder.length) ruleOrder = r.rules.map(x => x.rule);
  const tier = tiers(r);
  const t = x => ({unranked: 1e6, conflict: 1e6 + 1})[tier[x.rule]] ?? tier[x.rule];
  const rules = [...r.rules].sort((a, b) => t(a) - t(b) || (b.estimate ?? -1) - (a.estimate ?? -1));
  if (!rules.some(x => x.rule === focusRule)) focusRule = null;
  const f = focusRule ?? rules[0].rule;
  if (f !== lastFocus) { lastFocus = f; drawCurve(); }
  $('#ranking').classList.toggle('explore', explore);
  const pos = Object.fromEntries(rules.map((x, i) => [x.rule, i]));
  const bar = x => x.lo == null ? '' :
    `<div class="bar"><i style="left:${100 * x.lo}%;width:${100 * (x.hi - x.lo)}%"></i>` +
    (x.estimate == null ? '' : `<u style="left:${100 * x.estimate}%"></u>`) + `</div>`;
  const order = ['succ_delta', 'approx', 'succ', 'unresolved'];
  const list = showAll
    ? [...r.pairs].sort((a, b) => order.indexOf(a.relation) - order.indexOf(b.relation)).map(anyPair)
    : r.pairs.filter(p => p.a === f || p.b === f)
        .sort((a, b) => pos[a.a === f ? a.b : a.a] - pos[b.a === f ? b.b : b.a])
        .map(p => focusPair(p, f));
  $('#ranking').innerHTML =
    `<div class="hd">S<sub>ω</sub> at ω=${r.omega}, δ=${r.delta}, n=${r.n}` +
    `${explore ? '<span class="xp">exploratory</span>' : ''}` +
    `<span class="upd"></span></div>` +
    `<table>${rules.map((x, i) => {
      const k = tier[x.rule], named = typeof k === 'string';
      const head = named && (i === 0 || t(rules[i - 1]) !== t(x))
        ? `<tr class="lbl"><td colspan="5">${k === 'conflict' ? 'conflicting verdicts' : 'unranked'}</td></tr>` : '';
      return head + `<tr data-rule="${x.rule}" class="pick${x.rule === f ? ' on' : ''}">` +
        `<td class="rank">${named ? '–' : k}</td>` +
        `<td><i class="sw" style="background:${colorOf(x.rule)}"></i>${x.rule}</td><td>${pct(x.estimate)}</td>` +
        `<td>${pct(x.lo)}–${pct(x.hi)}</td><td>${bar(x)}</td></tr>`;
    }).join('')}</table>` +
    `<div class="hd">pairwise, simultaneous at α=${r.alpha}` +
    `<span class="tog" data-toggle="1">${showAll ? f : 'all pairs'}</span></div>` +
    list.join('');
  drawProgress();
}

$('#ranking').addEventListener('click', e => {
  const row = e.target.closest('tr[data-rule]');
  if (row) { focusRule = row.dataset.rule; showAll = false; }
  else if (e.target.closest('[data-toggle]')) showAll = !showAll;
  else return;
  if (lastRank) drawRanking(lastRank.r, lastRank.stale, lastRank.explore);
});

async function submit(label) {
  if (busy || !cur || cur.done) return;
  busy = true;
  try {
    const r = await api('/api/label', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cand_id: cur.cand_id, label, combined,
                            ms_elapsed: Math.round(performance.now() - shownAt)})
    });
    render(await r.json());
  } finally { busy = false; }
}

async function undo() {
  if (busy) return;
  busy = true;
  try {
    const r = await api('/api/undo', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: '{}'});
    render(await r.json());
  } finally { busy = false; }
}

// ── the checkpoint reveal: the exact-grid intervals ──────────────────────────

function openReport() {
  $('#overlay').classList.add('show');
  $('#card').innerHTML = '<h2>Checkpoint</h2><p class="sub">Computing exact intervals…</p>';
  api('/api/report?start=1').then(poll);
}

function poll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    const d = await (await api('/api/report')).json();
    if (d.status === 'computing') return poll();
    drawReport(d);
  }, 900);
}

function reportCell(r) {
  if (!r) return '<td class="wait">n/a</td>';
  // Provenance moves to the tooltip: at any one reveal it is near-identical down a
  // column, so spelling it out per cell costs seven lines to say one thing.
  if (!r.available)
    return `<td class="wait" title="First checkpoint at ${r.next_checkpoint} observations `
         + `of this stream; ${r.stream_len} so far.">${r.stream_len}/${r.next_checkpoint}</td>`;
  const next = r.next_checkpoint == null
    ? 'no further checkpoint' : `next checkpoint ${r.next_checkpoint}`;
  return `<td class="cell" title="Checkpoint ${r.checkpoint_index} of ${r.n_checkpoints}, `
       + `read at n=${r.checkpoint}; ${next}; ${r.stream_len} observations in this stream `
       + `so far."><b>${pct(r.estimate)}</b> <span class="ci">${(100 * r.lo).toFixed(1)}`
       + `&ndash;${(100 * r.hi).toFixed(1)}</span></td>`;
}

// One shared axis per target, outside the table. A bar inside a cell is ~250px wide with
// its own 0-100% scale, so the only comparison that matters -- rule against rule at a
// fixed target -- is the one it cannot support.
function reportFigure(by, rules, targets) {
  return `<div class="fig">` + targets.map(t =>
    `<div class="pan"><h3>${LABEL[t]}</h3>` +
    rules.map(rule => {
      const r = by[rule][t];
      if (!r || !r.available)
        return `<div class="row"><span>${rule}</span><div class="track"></div></div>`;
      const w = 100 * (r.hi - r.lo), l = 100 * r.lo, e = 100 * r.estimate;
      return `<div class="row"><span>${rule}</span><div class="track">` +
             `<i style="left:${l}%;width:${w}%"></i>` +
             `<u style="left:${e}%"></u></div></div>`;
    }).join('') +
    `<div class="axis"><span></span><div><b>0</b><b>50</b><b>100%</b></div></div></div>`
  ).join('') + `</div>`;
}

function drawReport(d) {
  if (d.status === 'error') {
    $('#card').innerHTML = `<h2>Checkpoint</h2><div class="err">${d.error}</div>` +
      `<p><button onclick="closeReport()">continue labeling</button></p>`;
    return;
  }
  const by = {}, rules = [];
  for (const r of d.rows) {
    if (!(r.rule in by)) { by[r.rule] = {}; rules.push(r.rule); }
    by[r.rule][r.target] = r;
  }
  const targets = Object.keys(LABEL);
  const body = rules.map(rule =>
    `<tr><td class="rule">${rule}</td>` +
    targets.map(t => reportCell(by[rule][t])).join('') + `</tr>`).join('');
  $('#card').innerHTML = `
    <h2>Checkpoint at ${d.at} annotations</h2>
    <p class="sub">Each interval is read at the last checkpoint its own stream crossed.
       n counts that stream, not your annotations. Intervals never widen.</p>
    <table><thead><tr><th>rule</th>` +
      targets.map(t => `<th class="t">${LABEL[t]}</th>`).join('') +
    `</tr></thead><tbody>${body}</tbody></table>` +
    reportFigure(by, rules, targets) +
    `<p style="margin-top:18px"><button onclick="closeReport()">continue labeling</button></p>`;
}

function closeReport() {
  $('#overlay').classList.remove('show');
  clearTimeout(pollTimer);
}
window.closeReport = closeReport;

$('#real').onclick = () => submit(1);
$('#fake').onclick = () => submit(0);
$('#undo').onclick = undo;
$('#ckpt').onclick = openReport;
// A combined call is still a real call: this marks overlapping/simultaneous calls and
// does not change the binary label or enter any stream.
$('#flag').onclick = () => { combined = !combined; $('#flag').classList.toggle('on', combined); };

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if ($('#overlay').classList.contains('show')) {
    if (e.key === 'Escape' || e.key === 'Enter') closeReport();
    return;
  }
  if (e.key === '1') submit(1);
  else if (e.key === '0') submit(0);
  else if (e.key === 'c' || e.key === 'f') $('#flag').click();
  else if (e.key === 'r') openReport();
  else if (e.key === 'ArrowLeft') undo();
  else if (e.key === 'p') $('#play').click();
  else if (e.key === '[') setSpeed(speedIdx + 1);
  else if (e.key === ']') setSpeed(speedIdx - 1);
  else if (e.key === 'P') setAutoplay(!autoplay);
});

api('/api/meta').then(r => r.json()).then(m => { document.title = `vox label: ${m.name}`; });
load();
</script>
