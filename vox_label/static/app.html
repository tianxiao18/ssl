<!doctype html>
<meta charset="utf-8">
<title>vox label</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d27; --line:#2c2f3d; --ink:#e8e9ef; --dim:#9297ab;
    --real:#22d3ee; --fake:#fb923c; --flag:#f472b6; --cs:#7c8199;
    --hdr:42px; --ftr:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
       font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

  header{height:var(--hdr);display:flex;align-items:center;gap:16px;padding:0 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
  .sp{flex:1}
  .counter{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
  .counter b{color:var(--ink);font-weight:600}
  .blind{font-size:10.5px;color:var(--dim);border:1px solid var(--line);
         border-radius:999px;padding:1px 8px}

  /* Fixed-height grid: spectrograms left, live scores right. Nothing scrolls. */
  .wrap{height:calc(100vh - var(--hdr) - var(--ftr));display:grid;
        grid-template-columns:1fr 430px;gap:10px;padding:8px 12px}
  .left{display:flex;flex-direction:column;min-height:0;gap:6px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;
        font-variant-numeric:tabular-nums;flex:0 0 auto}
  .stack{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .frame{position:relative;flex:1 1 0;min-height:0;border:1px solid var(--line);
         border-radius:5px;overflow:hidden;background:#000}
  /* fill, not contain: the panel height is the constraint, and a stretched
     spectrogram is the repo's existing convention (preserveAspectRatio="none"). */
  .frame img{display:block;width:100%;height:100%;object-fit:fill}
  .frame .chip{position:absolute;top:5px;left:7px;font-size:10.5px;color:var(--dim);
               background:rgba(0,0,0,.62);padding:1px 6px;border-radius:4px}
  .frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .right{background:var(--panel);border:1px solid var(--line);border-radius:6px;
         display:flex;flex-direction:column;min-height:0}
  .right h2{margin:0;padding:8px 11px 6px;font-size:11px;color:var(--dim);
            text-transform:uppercase;letter-spacing:.05em;font-weight:600;
            border-bottom:1px solid var(--line)}
  .scroll{overflow:auto;flex:1 1 auto;min-height:0}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;
        font-size:11.5px}
  th,td{padding:3px 7px;border-bottom:1px solid #23263200;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;
     font-size:10px;text-transform:uppercase;letter-spacing:.04em;
     border-bottom:1px solid var(--line)}
  tr.grp td{padding-top:7px;color:var(--ink);font-weight:600;font-size:11px}
  td.na{color:var(--dim)}
  .bar{position:relative;height:7px;background:#282b39;border-radius:4px;width:112px}
  .bar i{position:absolute;top:0;bottom:0;background:var(--cs);border-radius:4px}
  .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--real)}
  .bar i.gridbar{background:var(--real);opacity:.55}

  footer{height:var(--ftr);display:flex;gap:8px;align-items:center;padding:0 16px;
         background:var(--panel);border-top:1px solid var(--line)}
  button{font:inherit;border:1px solid var(--line);background:#232633;color:var(--ink);
         border-radius:5px;padding:6px 13px;cursor:pointer}
  button:hover{border-color:#404560}
  button kbd{font:inherit;color:var(--dim);margin-right:6px}
  /* real / not-a-call are pressed on every candidate; combined and undo are rare.
     Equal weight for all four made the two that matter hard to find. */
  button.primary{font-size:15.5px;font-weight:600;padding:13px 28px;border-width:2px}
  button.primary kbd{font-size:13px;margin-right:9px}
  #real{border-color:var(--real)} #fake{border-color:var(--fake)}
  #flag.on{border-color:var(--flag);color:var(--flag)}

  #overlay{position:fixed;inset:0;background:rgba(8,9,13,.95);z-index:20;
           overflow:auto;padding:34px 20px;display:none}
  #overlay.show{display:block}
  .card{max-width:1020px;margin:0 auto;background:var(--panel);
        border:1px solid var(--line);border-radius:9px;padding:20px 24px}
  .card h2{margin:0 0 4px;font-size:16px}
  .card p.sub{margin:0 0 16px;color:var(--dim);font-size:12.5px;line-height:1.5}
  .card table{font-size:12.5px;table-layout:fixed}
  .card th,.card td{border-bottom:1px solid var(--line);padding:4px 8px}
  /* One row per rule, one column per target: the comparison worth making is across
     rules at a fixed target, and that is what a reader scans down a column. */
  .card th.t,.card td.cell,.card td.wait{text-align:left;width:26%}
  .card td.rule{font-weight:600;white-space:nowrap}
  .card td.cell{white-space:nowrap;font-variant-numeric:tabular-nums}
  .card td.cell b{font-size:13px}
  .card .ci{color:var(--dim);font-size:11px;margin-left:3px}
  /* Each cell reads at its own checkpoint and its own stream length, so the
     checkpoint belongs in the cell rather than in a column shared across targets. */
  .card td.wait{color:var(--dim);font-variant-numeric:tabular-nums}
  .fig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
  .fig h3{margin:0 0 6px;font-size:10px;font-weight:600;color:var(--dim);
          text-transform:uppercase;letter-spacing:.04em}
  .fig .row{display:grid;grid-template-columns:62px 1fr;gap:7px;align-items:center;
            height:17px}
  .fig .row>span{font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;
                 overflow:hidden;text-overflow:ellipsis}
  .fig .track{position:relative;height:10px;background:#22252f;border-radius:2px}
  .fig .track i{position:absolute;top:2px;bottom:2px;background:var(--real);opacity:.45;
                border-radius:2px}
  .fig .track u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--real)}
  .fig .axis{display:grid;grid-template-columns:62px 1fr;gap:7px;margin-top:4px}
  .fig .axis div{display:flex;justify-content:space-between;font-size:9.5px;
                 color:var(--dim);font-weight:400}
  .err{color:var(--fake);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11.5px}
</style>

<header>
  <h1>vox label</h1>
  <span class="blind">blind: detector pattern hidden</span>
  <span class="sp"></span>
  <span class="counter"><b id="ndone">0</b> labeled</span>
  <span class="counter">next checkpoint in <b id="tonext">?</b></span>
  <button id="ckpt" style="padding:3px 10px;font-size:12px"><kbd>r</kbd>checkpoint</button>
  <a href="/setup" style="color:var(--dim);font-size:12px;text-decoration:none">setup</a>
</header>

<div class="wrap">
  <div class="left">
    <div class="meta" id="meta"></div>
    <div class="stack" id="frames"></div>
  </div>
  <div class="right">
    <h2>live scores, anytime-valid</h2>
    <div class="scroll"><table id="live"><thead><tr>
      <th>rule</th><th>n</th><th>est</th><th>interval</th><th></th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</div>

<footer>
  <button id="real" class="primary"><kbd>1</kbd>real call</button>
  <button id="fake" class="primary"><kbd>0</kbd>not a call</button>
  <button id="flag"><kbd>c</kbd>combined</button>
  <button id="undo"><kbd>&larr;</kbd>undo</button>
</footer>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
const $ = s => document.querySelector(s);
// 409 means no campaign is bound yet: the setup page is where one gets chosen.
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 409) { location.href = '/setup'; throw new Error('no campaign bound'); }
  return r;
}
const pct = v => v == null ? 'n/a' : (100 * v).toFixed(1) + '%';
const LABEL = {precision: 'precision', recall: 'rel. recall', f1: 'F1'};
let cur = null, combined = false, shownAt = 0, busy = false, pollTimer = null;

async function load() { render(await (await api('/api/next')).json()); }

function render(d) {
  cur = d; combined = false; shownAt = performance.now();
  $('#flag').classList.remove('on');
  $('#ndone').textContent = d.n_labeled ?? 0;
  $('#tonext').textContent = d.to_next_reveal ?? '?';
  refreshLive();

  if (d.done) {
    $('#meta').textContent = '';
    $('#frames').innerHTML = '<p style="color:var(--dim)">Every candidate is labeled.</p>';
    return;
  }

  $('#meta').innerHTML =
    `<span>${d.clip}</span><span>${d.t_start.toFixed(3)}–${d.t_end.toFixed(3)} s</span>` +
    `<span>${d.duration_ms.toFixed(0)} ms</span><span>#${d.cand_id}</span>`;

  // Candidate span as a fraction of the rendered view, so the bracket lands correctly
  // whatever the panel's pixel width happens to be.
  const span = d.view_hi - d.view_lo;
  const x0 = 1000 * (d.t_start - d.view_lo) / span;
  const x1 = 1000 * (d.t_end - d.view_lo) / span;

  $('#frames').innerHTML = d.channels.map(ch => `
    <div class="frame">
      <img src="/api/crop?cand_id=${d.cand_id}&ch=${ch}" alt="">
      <span class="chip">ch ${ch}</span>
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
        <rect x="${x0}" y="0" width="${Math.max(x1 - x0, 0.6)}" height="100"
              fill="none" stroke="var(--real)" stroke-width="2"
              stroke-dasharray="7 5" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>`).join('');

  if (d.reveal_due) openReport();
}

async function refreshLive() {
  const d = await (await api('/api/live')).json();
  const tb = $('#live tbody');
  let html = '', lastRule = null;
  for (const r of d.rows) {
    if (r.rule !== lastRule) {
      html += `<tr class="grp"><td colspan="5">${r.rule}</td></tr>`;
      lastRule = r.rule;
    }
    if (!r.n) {
      html += `<tr><td style="padding-left:14px">${LABEL[r.target]}</td>` +
              `<td class="na" colspan="4">no observations yet</td></tr>`;
      continue;
    }
    const w = 100 * (r.hi - r.lo), l = 100 * r.lo, e = 100 * r.estimate;
    html += `<tr><td style="padding-left:14px">${LABEL[r.target]}</td>
      <td>${r.n}</td><td>${pct(r.estimate)}</td>
      <td>${pct(r.lo)}–${pct(r.hi)}</td>
      <td><div class="bar"><i style="left:${l}%;width:${w}%"></i>
          <u style="left:${e}%"></u></div></td></tr>`;
  }
  tb.innerHTML = html;
}

async function submit(label) {
  if (busy || !cur || cur.done) return;
  busy = true;
  try {
    const r = await api('/api/label', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cand_id: cur.cand_id, label, combined,
                            ms_elapsed: Math.round(performance.now() - shownAt)})
    });
    render(await r.json());
  } finally { busy = false; }
}

async function undo() {
  if (busy) return;
  busy = true;
  try {
    const r = await api('/api/undo', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: '{}'});
    render(await r.json());
  } finally { busy = false; }
}

// ── the checkpoint reveal: the exact-grid intervals ──────────────────────────

function openReport() {
  $('#overlay').classList.add('show');
  $('#card').innerHTML = '<h2>Checkpoint</h2><p class="sub">Computing exact intervals…</p>';
  api('/api/report?start=1').then(poll);
}

function poll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    const d = await (await api('/api/report')).json();
    if (d.status === 'computing') return poll();
    drawReport(d);
  }, 900);
}

function reportCell(r) {
  if (!r) return '<td class="wait">n/a</td>';
  // Provenance moves to the tooltip: at any one reveal it is near-identical down a
  // column, so spelling it out per cell costs seven lines to say one thing.
  if (!r.available)
    return `<td class="wait" title="First checkpoint at ${r.next_checkpoint} observations `
         + `of this stream; ${r.stream_len} so far.">${r.stream_len}/${r.next_checkpoint}</td>`;
  const next = r.next_checkpoint == null
    ? 'no further checkpoint' : `next checkpoint ${r.next_checkpoint}`;
  return `<td class="cell" title="Checkpoint ${r.checkpoint_index} of ${r.n_checkpoints}, `
       + `read at n=${r.checkpoint}; ${next}; ${r.stream_len} observations in this stream `
       + `so far."><b>${pct(r.estimate)}</b> <span class="ci">${(100 * r.lo).toFixed(1)}`
       + `&ndash;${(100 * r.hi).toFixed(1)}</span></td>`;
}

// One shared axis per target, outside the table. A bar inside a cell is ~250px wide with
// its own 0-100% scale, so the only comparison that matters -- rule against rule at a
// fixed target -- is the one it cannot support.
function reportFigure(by, rules, targets) {
  return `<div class="fig">` + targets.map(t =>
    `<div class="pan"><h3>${LABEL[t]}</h3>` +
    rules.map(rule => {
      const r = by[rule][t];
      if (!r || !r.available)
        return `<div class="row"><span>${rule}</span><div class="track"></div></div>`;
      const w = 100 * (r.hi - r.lo), l = 100 * r.lo, e = 100 * r.estimate;
      return `<div class="row"><span>${rule}</span><div class="track">` +
             `<i style="left:${l}%;width:${w}%"></i>` +
             `<u style="left:${e}%"></u></div></div>`;
    }).join('') +
    `<div class="axis"><span></span><div><b>0</b><b>50</b><b>100%</b></div></div></div>`
  ).join('') + `</div>`;
}

function drawReport(d) {
  if (d.status === 'error') {
    $('#card').innerHTML = `<h2>Checkpoint</h2><div class="err">${d.error}</div>` +
      `<p><button onclick="closeReport()">continue labeling</button></p>`;
    return;
  }
  const by = {}, rules = [];
  for (const r of d.rows) {
    if (!(r.rule in by)) { by[r.rule] = {}; rules.push(r.rule); }
    by[r.rule][r.target] = r;
  }
  const targets = Object.keys(LABEL);
  const body = rules.map(rule =>
    `<tr><td class="rule">${rule}</td>` +
    targets.map(t => reportCell(by[rule][t])).join('') + `</tr>`).join('');
  $('#card').innerHTML = `
    <h2>Checkpoint at ${d.at} annotations</h2>
    <p class="sub">Each interval is read at the last checkpoint its own stream crossed.
       n counts that stream, not your annotations. Intervals never widen.</p>
    <table><thead><tr><th>rule</th>` +
      targets.map(t => `<th class="t">${LABEL[t]}</th>`).join('') +
    `</tr></thead><tbody>${body}</tbody></table>` +
    reportFigure(by, rules, targets) +
    `<p style="margin-top:18px"><button onclick="closeReport()">continue labeling</button></p>`;
}

function closeReport() {
  $('#overlay').classList.remove('show');
  clearTimeout(pollTimer);
}
window.closeReport = closeReport;

$('#real').onclick = () => submit(1);
$('#fake').onclick = () => submit(0);
$('#undo').onclick = undo;
$('#ckpt').onclick = openReport;
// A combined call is still a real call: this marks overlapping/simultaneous calls and
// does not change the binary label or enter any stream.
$('#flag').onclick = () => { combined = !combined; $('#flag').classList.toggle('on', combined); };

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if ($('#overlay').classList.contains('show')) {
    if (e.key === 'Escape' || e.key === 'Enter') closeReport();
    return;
  }
  if (e.key === '1') submit(1);
  else if (e.key === '0') submit(0);
  else if (e.key === 'c' || e.key === 'f') $('#flag').click();
  else if (e.key === 'r') openReport();
  else if (e.key === 'ArrowLeft') undo();
});

api('/api/meta').then(r => r.json()).then(m => { document.title = `vox label: ${m.name}`; });
load();
</script>
