<!doctype html>
<meta charset="utf-8">
<title>vox label</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d27; --line:#2c2f3d; --ink:#e8e9ef; --dim:#9297ab;
    --real:#22d3ee; --fake:#fb923c;
  }
  *{box-sizing:border-box}
  /* .rows sets display:flex, which would otherwise win over the UA hidden rule. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:0 18px;height:42px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px}
  .sp{flex:1}
  main{max-width:840px;margin:0 auto;padding:18px 18px 40px;
       display:flex;flex-direction:column;gap:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--dim);
          text-transform:uppercase;letter-spacing:.04em}
  input,select{font:inherit;background:#232633;color:var(--ink);
               border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%}
  input:focus,select:focus{outline:none;border-color:#404560}
  input[readonly]{color:var(--dim)}

  .modes{display:flex;gap:8px}
  .modes button{flex:1}
  button{font:inherit;border:1px solid var(--line);background:#232633;color:var(--ink);
         border-radius:5px;padding:7px 14px;cursor:pointer}
  button:hover{border-color:#404560}
  button.on{border-color:var(--real);color:var(--real)}
  button.go{padding:10px 26px;font-size:14px;font-weight:600;border-color:var(--real)}
  button:disabled{opacity:.45;cursor:default}

  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:center;
       border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer;
       background:#1b1d27}
  .row:hover{border-color:#404560}
  .row.on{border-color:var(--real)}
  .row .nm{font-weight:600}
  .row .det{color:var(--dim);font-size:11px;margin-top:2px}
  .row .num{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim);
            text-align:right}
  .bar{position:relative;height:7px;background:#282b39;border-radius:4px;margin-top:5px}
  .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--real);border-radius:4px}
  .warn{color:var(--fake);font-size:11px;margin-top:3px}

  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;
        font-size:11.5px;margin-top:10px}
  th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;
     letter-spacing:.04em}
  code{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);
       word-break:break-all}
  .err{color:var(--fake);white-space:pre-wrap;font-family:ui-monospace,monospace;
       font-size:11.5px}
  .foot{display:flex;align-items:center;gap:14px}
</style>

<header>
  <h1>vox label</h1>
  <span class="sub">choose a campaign</span>
  <span class="sp"></span>
  <span class="sub" id="current"></span>
</header>

<main>
  <div class="grid">
    <label class="f">your name<input id="annotator" value="anon"></label>
  </div>

  <div class="sub">Campaigns found in <code id="root"></code></div>
  <div class="rows" id="campaigns"></div>

  <label class="f">or open a campaign folder by path
    <input id="path" placeholder="/path/to/label_campaigns/my_campaign"></label>

  <div class="foot">
    <button class="go" id="start">start labeling</button>
    <span id="status" class="sub"></span>
  </div>
  <div class="err" id="err"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let S = null, pick = null;
const fmt = n => n == null ? '?' : n.toLocaleString();

async function boot() {
  S = await (await fetch('/api/setup')).json();
  $('root').textContent = S.campaign_root;
  if (S.current && S.current.annotator) $('annotator').value = S.current.annotator;
  if (S.current && S.current.bound)
    $('current').textContent = `labeling ${S.current.name} (${fmt(S.current.n_labeled)} labeled)`;
  render();
}

function render() {
  $('campaigns').innerHTML = S.campaigns.map((c, i) => {
    const pct = c.pct == null ? 0 : Math.min(100, c.pct);
    return `<div class="row${pick === i ? ' on' : ''}" data-i="${i}">
      <div>
        <div class="nm">${c.name}</div>
        <div class="det">${c.dataset || 'dataset unknown'} &middot; ${c.detectors.join(', ')}</div>
        ${c.pool_exists ? '' : '<div class="warn">candidates.csv missing</div>'}
      </div>
      <div>
        <div class="num">${fmt(c.n_labeled)} / ${fmt(c.n_max)} labeled</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`;
  }).join('') || `<div class="warn">No campaigns here. The GUI looks in outputs/label_campaigns
    under the folder it was started from (${S.cwd}). Start it from the folder that holds
    outputs/, or make a campaign first:<br><code>python scripts/build_candidate_pool.py ...
    --out outputs/label_campaigns/NAME/candidates.csv</code><br><code>python
    scripts/make_campaign.py --pool outputs/label_campaigns/NAME/candidates.csv
    --detectors ... --out outputs/label_campaigns/NAME</code></div>`;
  for (const el of $('campaigns').children) {
    if (el.dataset.i === undefined) continue;
    el.onclick = () => { pick = Number(el.dataset.i); $('path').value = ''; render(); };
  }
}

$('path').oninput = () => { if (pick != null) { pick = null; render(); } };

async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

$('start').onclick = async () => {
  $('err').textContent = '';
  $('status').textContent = 'loading the campaign';
  $('start').disabled = true;
  try {
    const typed = $('path').value.trim();
    const c = pick == null ? null : S.campaigns[pick];
    if (!c && !typed) throw new Error('pick a campaign or type its folder');
    await post('/api/setup/start', {
      campaign_dir: c ? c.dir : typed, dataset: c ? c.dataset : null,
      annotator: $('annotator').value.trim() || 'anon'});
    location.href = '/';
  } catch (e) {
    $('err').textContent = e.message;
    $('status').textContent = '';
    $('start').disabled = false;
  }
};

boot();
</script>
